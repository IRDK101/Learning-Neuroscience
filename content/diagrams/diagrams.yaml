# Each diagram is an original SVG in this folder. Hotspots are elements with data-ref="<entity id>".
# The same SVG can back several diagrams with different layers turned on.

- id: brain-midsagittal
  title: Brain, midline view
  svg: brain-midsagittal.svg
  description: The brain cut down the middle between the two hemispheres, seen from the inside. Front of the head is on the left.
  topics: [nervous-system-structure, nt-systems]

- id: nt-overlay
  title: Neurotransmitter systems
  svg: brain-midsagittal.svg
  description: Where the brain's diffuse modulatory systems start and where their axons go. Turn each transmitter on or off. Structures that lie off the midline (striatum, hippocampus) are drawn faintly.
  topics: [nt-systems]
  overlay: true
  layers:
    - { id: ach, name: Acetylcholine (ACh), color: ach }
    - { id: da, name: Dopamine (DA), color: da }
    - { id: ne, name: Norepinephrine (NE), color: ne }
    - { id: serotonin, name: Serotonin (5-HT), color: serotonin }
    - { id: deep, name: Deep structures }
  defaultLayers: [ach, da, ne, serotonin, deep]

- id: synapse
  title: Chemical synapse
  svg: synapse.svg
  description: A chemical synapse, with the parts that synthesis, release, receptors, reuptake and drugs act on.
  topics: [synaptic-transmission, nt-systems]

- id: orientation
  title: Directions and planes
  svg: orientation.svg
  description: Anatomical directions on a four-legged animal and on a standing human, where the nervous system bends 90°, plus the three section planes. Tap any arrow or plane.
  topics: [nervous-system-structure]
  quiz: false

- id: brain-lateral
  title: Brain, side view
  svg: brain-lateral.svg
  description: The left side of the brain, front of the head on the left. The lobes, the central sulcus and lateral fissure, and the main primary and language areas.
  topics: [nervous-system-structure, history]
  layers:
    - { id: arteries, name: Blood supply }

- id: brain-arteries
  title: Blood supply of the cortex
  svg: brain-lateral.svg
  description: Which artery feeds which part of the cortex, seen from the side. The middle cerebral artery covers most of the lateral surface.
  topics: [nervous-system-structure]
  overlay: true
  layers:
    - { id: arteries, name: Blood supply }
  defaultLayers: [arteries]

- id: brain-coronal
  title: Brain, coronal slice
  svg: brain-coronal.svg
  description: A front-to-back slice through the thalamus, seen from the front. The basal ganglia, ventricles, thalamus and medial temporal structures.
  topics: [nervous-system-structure]

- id: meninges
  title: Meninges
  svg: meninges.svg
  description: The layers between the skull and the brain, in cross-section (much thicker than real life).
  topics: [nervous-system-structure]

- id: neuron
  title: Neuron and glia
  svg: neuron.svg
  description: A typical multipolar neuron, from its dendrites to its axon terminals, with three kinds of glia.
  topics: [neurons-and-glia]

- id: membrane
  title: Membrane at rest
  svg: membrane.svg
  description: A patch of neuron membrane. Na⁺, Cl⁻ and Ca²⁺ are concentrated outside, K⁺ inside; leak channels, pumps and gated channels sit in the bilayer.
  topics: [membrane-at-rest, action-potential]

- id: action-potential-trace
  title: The action potential
  svg: action-potential.svg
  description: Voltage inside a neuron during one action potential, which lasts about 1–2 ms. Tap a phase to see what the channels are doing.
  topics: [action-potential]
  quiz: false

- id: taste-bud
  title: Taste bud
  svg: taste-bud.svg
  description: A taste bud in the tongue's surface, with taste cells reaching up to the taste pore and gustatory axons below. The inset shows where buds sit on a papilla.
  topics: [chemical-senses]

- id: visual-pathway
  title: Visual pathway
  svg: visual-pathway.svg
  description: The route from the eyes to the primary visual cortex, seen from below the brain. Blue fibers carry the left visual field and orange the right; nasal fibers cross at the chiasm.
  topics: [central-visual-system, eye]

- id: long-tracts
  title: Touch, pain and motor pathways
  svg: long-tracts.svg
  description: How signals for the right side of the body travel. Touch crosses in the medulla, pain and temperature cross in the spinal cord, and the corticospinal (motor) tract crosses at the bottom of the medulla.
  topics: [somatosensory, brain-control-of-movement]
  overlay: true
  layers:
    - { id: touch, name: Touch (dorsal column), color: touch }
    - { id: pain, name: Pain and temperature (spinothalamic), color: pain }
    - { id: motor, name: Movement (corticospinal), color: motor }
  defaultLayers: [touch, pain, motor]

- id: spinal-reflex
  title: Spinal reflexes
  svg: spinal-reflex.svg
  description: The spinal cord in cross-section wired to the thigh. A tap stretches the quadriceps; its spindle's Ia axon excites the quadriceps motor neuron and, through an inhibitory interneuron, quiets the hamstring.
  topics: [spinal-control-of-movement, somatosensory]

- id: ear
  title: The ear
  svg: ear.svg
  description: The right ear seen from the front. Sound passes from the outer ear through the eardrum and ossicles of the middle ear to the fluid-filled cochlea; the vestibular organs sit beside it.
  topics: [auditory-vestibular]

- id: cochlea
  title: Inside the cochlea
  svg: cochlea.svg
  description: One turn of the cochlea cut across, showing its three fluid chambers and the organ of Corti on the basilar membrane.
  topics: [auditory-vestibular]

- id: skin
  title: Skin and its receptors
  svg: skin.svg
  description: Skin in cross-section, hairless on the left and hairy on the right, with the three layers and the five kinds of sensory ending.
  topics: [somatosensory]

- id: eye
  title: The eye
  svg: eye.svg
  description: The right eye seen from above, cut through the middle. Light enters through the cornea and lens and is focused on the retina; the fovea is where vision is sharpest.
  topics: [eye]

- id: retina
  title: Layers of the retina
  svg: retina.svg
  description: The retina's cell layers. Light passes through the ganglion and bipolar cells before reaching the rods and cones at the back.
  topics: [eye]

- id: olfaction
  title: Smell, from nose to bulb
  svg: olfaction.svg
  description: Olfactory receptor cells in the roof of the nasal cavity send axons through the cribriform plate to the olfactory bulb. Cells with the same receptor type (same color) all converge on one glomerulus.
  topics: [chemical-senses]

- id: limbic-system
  title: Limbic system and Papez circuit
  svg: brain-midsagittal.svg
  description: The midline view with the emotion structures picked out. Arrows trace the Papez circuit from the hippocampus through the fornix, mammillary body, thalamus and cingulate cortex. The amygdala and hippocampus lie off the midline and are drawn faintly.
  topics: [emotion, memory]
  overlay: true
  layers:
    - { id: papez, name: Papez circuit, color: papez }
  defaultLayers: [papez]

- id: default-mode-network
  title: Default mode network
  svg: brain-midsagittal.svg
  description: The two big midline hubs of the default mode network, which become more active when you rest. The third hub, the temporoparietal junction, is on the side of the brain.
  topics: [rest-attention-unconscious]
  overlay: true
  quiz: false
  layers:
    - { id: dmn, name: Default mode network, color: dmn }
  defaultLayers: [dmn]

- id: language-areas
  title: Language areas
  svg: brain-lateral.svg
  description: The left hemisphere's language areas. Arrows follow the Wernicke-Geschwind model for repeating a heard word, from A1 to Wernicke's area, along the arcuate fasciculus to Broca's area, then to the face area of M1.
  topics: [language]
  overlay: true
  layers:
    - { id: language, name: Wernicke-Geschwind route, color: language }
  defaultLayers: [language]

- id: attention-areas
  title: Attention areas
  svg: brain-lateral.svg
  description: Two cortical areas that steer attention. The frontal eye fields point attention (and the eyes) at locations; the posterior parietal cortex maps space, and right-side damage causes neglect.
  topics: [rest-attention-unconscious]
  overlay: true
  quiz: false
  layers:
    - { id: attention, name: Attention areas, color: attention }
  defaultLayers: [attention]

- id: ltp-synapse
  title: Synapse during LTP
  svg: ltp-synapse.svg
  description: A glutamate synapse onto a dendritic spine. AMPA receptors depolarize the spine, which frees the NMDA receptor of its Mg²⁺ block; Ca²⁺ then switches on CaMKII and PKC, which boost AMPA receptors and insert new ones.
  topics: [memory]

- id: hpa-axis
  title: HPA stress axis
  svg: hpa-axis.svg
  description: The stress hormone loop. The hypothalamus signals the pituitary, which signals the adrenal glands to release cortisol. The amygdala pushes the loop up; the hippocampus senses cortisol and brakes it.
  topics: [mental-illness, emotion]

- id: medial-temporal-lobe
  title: Medial temporal lobe
  svg: medial-temporal-lobe.svg
  description: The memory structures of the medial temporal lobe, seen from the inside. Information from the cortex flows through the perirhinal and parahippocampal cortices to the entorhinal cortex and into the hippocampus.
  topics: [memory]
