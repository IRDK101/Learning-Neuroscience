      <text data-label-for="pituitary-gland" x="120" y="276">Pituitary gland</text>
      <line data-label-for="pituitary-gland" class="leader" x1="236" y1="272" x2="358" y2="254"/>
      <text class="small deco-label" x="120" y="294">releases ACTH into the blood</text>
      <text data-label-for="amygdala" x="560" y="250">Amygdala</text>
      <line data-label-for="amygdala" class="leader" x1="558" y1="246" x2="444" y2="224"/>
