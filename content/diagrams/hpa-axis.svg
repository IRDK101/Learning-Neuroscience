      <text data-label-for="hippocampus" x="560" y="170">Hippocampus</text>
      <line data-label-for="hippocampus" class="leader" x1="558" y1="166" x2="494" y2="192"/>
      <text class="small deco-label" x="560" y="186">senses cortisol, brakes (−)</text>
      <text data-label-for="adrenal-gland" x="120" y="520">Adrenal glands</text>
      <line data-label-for="adrenal-gland" class="leader" x1="236" y1="524" x2="284" y2="548"/>
      <text class="small deco-label" x="120" y="538">on top of the kidneys</text>
      <text data-label-for="cortisol" x="560" y="400">Cortisol</text>
      <line data-label-for="cortisol" class="leader" x1="558" y1="396" x2="522" y2="400"/>
      <text class="small deco-label" x="560" y="416">fight or flight, body-wide</text>
      <text class="small deco-label" x="320" y="690">Kidneys</text>
    </g>
