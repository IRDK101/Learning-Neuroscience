<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" role="img" aria-label="A chemical synapse: presynaptic terminal on top, postsynaptic dendrite below">
  <!-- Original drawing for NeuroMap. Stylized, not to scale. Hotspots use data-ref="<entity-id>". -->
  <defs>
    <marker id="syn-arrow" class="arrow arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <g class="base">

    <!-- presynaptic terminal -->
    <path data-ref="presynaptic-terminal" data-fill="var(--cell-pre)" d="M 340 0 L 460 0 L 460 40 C 600 60 650 160 632 250 C 624 290 602 302 562 302 L 238 302 C 198 302 178 290 170 250 C 152 160 200 60 340 40 Z"/>

    <!-- mitochondrion with MAO on its surface -->
    <g data-ref="mitochondrion" data-fill="var(--cell-mito)">
      <ellipse cx="520" cy="118" rx="58" ry="27"/>
      <path class="deco cristae" d="M 482 108 C 490 128 500 128 506 108 C 512 128 522 128 528 108 C 534 128 544 128 550 108"/>
    </g>
    <g data-ref="monoamine-oxidase" class="mol">
      <circle cx="470" cy="100" r="7"/>
      <circle cx="574" cy="128" r="7"/>
      <circle cx="540" cy="146" r="7"/>
    </g>

    <!-- vesicles with transmitter -->
    <g data-ref="synaptic-vesicle" data-fill="var(--cell-vesicle)">
      <circle cx="300" cy="150" r="19"/>
      <circle cx="356" cy="182" r="19"/>
      <circle cx="410" cy="140" r="19"/>
      <circle cx="292" cy="222" r="19"/>
      <circle cx="372" cy="246" r="19"/>
      <path d="M 410 302 C 410 276 436 268 452 280 C 462 288 464 296 464 302 Z"/>
    </g>
    <g class="deco nt-dots">
      <circle cx="295" cy="146" r="3"/><circle cx="305" cy="156" r="3"/><circle cx="302" cy="142" r="3"/>
      <circle cx="350" cy="178" r="3"/><circle cx="362" cy="188" r="3"/><circle cx="359" cy="175" r="3"/>
      <circle cx="405" cy="136" r="3"/><circle cx="416" cy="146" r="3"/><circle cx="412" cy="133" r="3"/>
      <circle cx="287" cy="218" r="3"/><circle cx="298" cy="228" r="3"/>
      <circle cx="366" cy="242" r="3"/><circle cx="378" cy="252" r="3"/>
      <circle cx="430" cy="314" r="3"/><circle cx="446" cy="322" r="3"/><circle cx="420" cy="326" r="3"/>
      <circle cx="458" cy="312" r="3"/><circle cx="392" cy="318" r="3"/><circle cx="476" cy="326" r="3"/>
    </g>

    <!-- SNARE proteins tethering the fusing vesicle -->
    <path data-ref="snare-proteins" d="M 404 296 l 6 -8 l 6 8 l 6 -8 l 6 8 M 448 296 l 6 -8 l 6 8 l 6 -8 l 6 8" class="line-hotspot"/>

    <!-- cleft -->
    <rect data-ref="synaptic-cleft" data-fill="var(--cell-cleft)" x="150" y="302" width="500" height="40"/>

    <!-- voltage-gated Ca channel in the terminal membrane -->
    <g data-ref="voltage-gated-calcium-channel" class="mol">
      <rect x="526" y="280" width="12" height="34" rx="4"/>
      <rect x="546" y="280" width="12" height="34" rx="4"/>
    </g>
    <path class="deco flow" marker-end="url(#syn-arrow)" d="M 542 336 L 542 268"/>
    <text class="deco ion" x="566" y="338">Ca²⁺</text>

    <!-- reuptake transporter -->
    <g data-ref="reuptake-transporter" class="mol">
      <rect x="236" y="280" width="30" height="34" rx="9"/>
    </g>
    <path class="deco flow" marker-end="url(#syn-arrow)" d="M 251 330 L 251 262"/>

    <!-- autoreceptor -->
    <path data-ref="autoreceptor" class="mol" d="M 318 284 L 318 300 L 312 314 L 318 314 L 322 304 L 326 314 L 332 314 L 326 300 L 326 284 Z"/>

    <!-- enzyme in the cleft (e.g., AChE) -->
    <path data-ref="acetylcholinesterase" class="mol" d="M 612 322 L 624 314 A 14 14 0 1 0 624 330 Z"/>

    <!-- postsynaptic dendrite -->
    <path data-ref="postsynaptic-dendrite" data-fill="var(--cell-post)" d="M 120 342 L 680 342 C 700 342 720 360 720 382 L 720 620 L 80 620 L 80 382 C 80 360 100 342 120 342 Z"/>

    <!-- astrocyte wrapping the synapse on the left -->
    <path data-ref="astrocyte" data-fill="var(--cell-glia)" d="M 20 210 C 60 190 110 200 140 240 C 160 268 162 300 150 320 C 162 340 164 372 142 400 C 112 440 60 450 20 430 C 40 400 60 380 58 320 C 60 270 40 240 20 210 Z"/>

    <!-- ionotropic receptor (ligand-gated channel) -->
    <g data-ref="ionotropic-receptor" class="mol">
      <rect x="400" y="330" width="16" height="40" rx="5"/>
      <rect x="426" y="330" width="16" height="40" rx="5"/>
    </g>
    <path class="deco flow" marker-end="url(#syn-arrow)" d="M 421 318 L 421 400"/>
    <text class="deco ion" x="432" y="404">Na⁺</text>

    <!-- metabotropic receptor + G protein -->
    <path data-ref="metabotropic-receptor" class="mol" d="M 506 334 l 0 34 l 8 0 l 0 -34 l 8 0 l 0 34 l 8 0 l 0 -34 l 8 0 l 0 34 l 8 0 l 0 -34 l 8 0 l 0 34"/>
    <g data-ref="g-protein" class="mol">
      <circle cx="534" cy="392" r="11"/>
      <circle cx="555" cy="398" r="9"/>
      <circle cx="546" cy="414" r="8"/>
    </g>

    <g class="labels lbl-base">
      <text text-anchor="middle" data-label-for="presynaptic-terminal" x="400" y="84">Presynaptic terminal</text>
      <text data-label-for="mitochondrion" x="640" y="92">Mitochondrion</text>
      <line data-label-for="mitochondrion" class="leader" x1="638" y1="88" x2="574" y2="108"/>
      <text data-label-for="monoamine-oxidase" x="660" y="160">MAO</text>
      <line data-label-for="monoamine-oxidase" class="leader" x1="658" y1="156" x2="580" y2="132"/>
      <text data-label-for="synaptic-vesicle" x="150" y="140" text-anchor="end">Synaptic vesicles</text>
      <line data-label-for="synaptic-vesicle" class="leader" x1="152" y1="136" x2="280" y2="150"/>
      <text text-anchor="middle" data-label-for="snare-proteins" x="440" y="236">SNAREs</text>
      <line data-label-for="snare-proteins" class="leader" x1="440" y1="240" x2="434" y2="288"/>
      <text data-label-for="voltage-gated-calcium-channel" x="690" y="246" text-anchor="end">Ca²⁺ channel</text>
      <line data-label-for="voltage-gated-calcium-channel" class="leader" x1="660" y1="250" x2="560" y2="286"/>
      <text data-label-for="reuptake-transporter" x="186" y="250" text-anchor="end">Reuptake</text>
      <text data-label-for="reuptake-transporter" x="186" y="268" text-anchor="end">transporter</text>
      <line data-label-for="reuptake-transporter" class="leader" x1="188" y1="262" x2="236" y2="290"/>
      <text data-label-for="autoreceptor" x="300" y="270" text-anchor="end">Autoreceptor</text>
      <text data-label-for="synaptic-cleft" x="760" y="326" text-anchor="end">Synaptic cleft</text>
      <line data-label-for="synaptic-cleft" class="leader" x1="680" y1="322" x2="652" y2="322"/>
      <text text-anchor="middle" data-label-for="acetylcholinesterase" x="700" y="376">Enzyme (AChE)</text>
      <line data-label-for="acetylcholinesterase" class="leader" x1="690" y1="362" x2="624" y2="330"/>
      <text data-label-for="ionotropic-receptor" x="300" y="420" text-anchor="end">Ionotropic receptor</text>
      <line data-label-for="ionotropic-receptor" class="leader" x1="302" y1="416" x2="398" y2="360"/>
      <text data-label-for="metabotropic-receptor" x="640" y="400">Metabotropic</text>
      <text data-label-for="metabotropic-receptor" x="640" y="418">receptor</text>
      <line data-label-for="metabotropic-receptor" class="leader" x1="638" y1="398" x2="556" y2="360"/>
      <text data-label-for="g-protein" x="570" y="444">G protein</text>
      <text text-anchor="middle" data-label-for="postsynaptic-dendrite" x="400" y="560">Postsynaptic dendrite</text>
      <text text-anchor="middle" data-label-for="astrocyte" x="70" y="476">Astrocyte</text>
    </g>
  </g>
</svg>
