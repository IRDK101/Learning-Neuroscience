<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-label="A patch of neuron membrane at rest, with ion channels, pumps and the ions on each side">
  <!-- Original drawing for NeuroMap. Schematic: the outside of the cell is on top, the inside (cytosol) below. -->
  <defs>
    <marker id="mem-arrow" class="arrow arrow-plain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <g class="deco axes">
    <text x="14" y="26">Outside the cell (extracellular fluid)</text>
    <text x="14" y="438">Inside the cell (cytosol): about –65 mV</text>
  </g>
  <g class="base">
    <rect data-ref="phospholipid-bilayer" data-fill="var(--cell-pre)" x="0" y="170" width="900" height="70"/>
    <g class="deco lipid-heads"><circle cx="8" cy="176" r="6"/><circle cx="8" cy="234" r="6"/><circle cx="24" cy="176" r="6"/><circle cx="24" cy="234" r="6"/><circle cx="40" cy="176" r="6"/><circle cx="40" cy="234" r="6"/><circle cx="56" cy="176" r="6"/><circle cx="56" cy="234" r="6"/><circle cx="72" cy="176" r="6"/><circle cx="72" cy="234" r="6"/><circle cx="88" cy="176" r="6"/><circle cx="88" cy="234" r="6"/><circle cx="104" cy="176" r="6"/><circle cx="104" cy="234" r="6"/><circle cx="120" cy="176" r="6"/><circle cx="120" cy="234" r="6"/><circle cx="136" cy="176" r="6"/><circle cx="136" cy="234" r="6"/><circle cx="152" cy="176" r="6"/><circle cx="152" cy="234" r="6"/><circle cx="168" cy="176" r="6"/><circle cx="168" cy="234" r="6"/><circle cx="184" cy="176" r="6"/><circle cx="184" cy="234" r="6"/><circle cx="200" cy="176" r="6"/><circle cx="200" cy="234" r="6"/><circle cx="216" cy="176" r="6"/><circle cx="216" cy="234" r="6"/><circle cx="232" cy="176" r="6"/><circle cx="232" cy="234" r="6"/><circle cx="248" cy="176" r="6"/><circle cx="248" cy="234" r="6"/><circle cx="264" cy="176" r="6"/><circle cx="264" cy="234" r="6"/><circle cx="280" cy="176" r="6"/><circle cx="280" cy="234" r="6"/><circle cx="296" cy="176" r="6"/><circle cx="296" cy="234" r="6"/><circle cx="312" cy="176" r="6"/><circle cx="312" cy="234" r="6"/><circle cx="328" cy="176" r="6"/><circle cx="328" cy="234" r="6"/><circle cx="344" cy="176" r="6"/><circle cx="344" cy="234" r="6"/><circle cx="360" cy="176" r="6"/><circle cx="360" cy="234" r="6"/><circle cx="376" cy="176" r="6"/><circle cx="376" cy="234" r="6"/><circle cx="392" cy="176" r="6"/><circle cx="392" cy="234" r="6"/><circle cx="408" cy="176" r="6"/><circle cx="408" cy="234" r="6"/><circle cx="424" cy="176" r="6"/><circle cx="424" cy="234" r="6"/><circle cx="440" cy="176" r="6"/><circle cx="440" cy="234" r="6"/><circle cx="456" cy="176" r="6"/><circle cx="456" cy="234" r="6"/><circle cx="472" cy="176" r="6"/><circle cx="472" cy="234" r="6"/><circle cx="488" cy="176" r="6"/><circle cx="488" cy="234" r="6"/><circle cx="504" cy="176" r="6"/><circle cx="504" cy="234" r="6"/><circle cx="520" cy="176" r="6"/><circle cx="520" cy="234" r="6"/><circle cx="536" cy="176" r="6"/><circle cx="536" cy="234" r="6"/><circle cx="552" cy="176" r="6"/><circle cx="552" cy="234" r="6"/><circle cx="568" cy="176" r="6"/><circle cx="568" cy="234" r="6"/><circle cx="584" cy="176" r="6"/><circle cx="584" cy="234" r="6"/><circle cx="600" cy="176" r="6"/><circle cx="600" cy="234" r="6"/><circle cx="616" cy="176" r="6"/><circle cx="616" cy="234" r="6"/><circle cx="632" cy="176" r="6"/><circle cx="632" cy="234" r="6"/><circle cx="648" cy="176" r="6"/><circle cx="648" cy="234" r="6"/><circle cx="664" cy="176" r="6"/><circle cx="664" cy="234" r="6"/><circle cx="680" cy="176" r="6"/><circle cx="680" cy="234" r="6"/><circle cx="696" cy="176" r="6"/><circle cx="696" cy="234" r="6"/><circle cx="712" cy="176" r="6"/><circle cx="712" cy="234" r="6"/><circle cx="728" cy="176" r="6"/><circle cx="728" cy="234" r="6"/><circle cx="744" cy="176" r="6"/><circle cx="744" cy="234" r="6"/><circle cx="760" cy="176" r="6"/><circle cx="760" cy="234" r="6"/><circle cx="776" cy="176" r="6"/><circle cx="776" cy="234" r="6"/><circle cx="792" cy="176" r="6"/><circle cx="792" cy="234" r="6"/><circle cx="808" cy="176" r="6"/><circle cx="808" cy="234" r="6"/><circle cx="824" cy="176" r="6"/><circle cx="824" cy="234" r="6"/><circle cx="840" cy="176" r="6"/><circle cx="840" cy="234" r="6"/><circle cx="856" cy="176" r="6"/><circle cx="856" cy="234" r="6"/><circle cx="872" cy="176" r="6"/><circle cx="872" cy="234" r="6"/><circle cx="888" cy="176" r="6"/><circle cx="888" cy="234" r="6"/></g>

    <g data-ref="potassium-leak-channel">
      <rect x="96" y="160" width="18" height="90" rx="6"/><rect x="128" y="160" width="18" height="90" rx="6"/>
    </g>
    <path class="deco flow" marker-end="url(#mem-arrow)" d="M 121 300 L 121 120"/>

    <path data-ref="sodium-potassium-pump" d="M 238 156 C 238 146 300 146 300 156 L 304 254 C 304 266 234 266 234 254 Z"/>
    <path class="deco flow" marker-end="url(#mem-arrow)" d="M 252 290 L 252 112"/>
    <path class="deco flow" marker-end="url(#mem-arrow)" d="M 286 110 L 286 292"/>
    <text class="deco arrow-label" x="244" y="100" text-anchor="end">3 Na⁺ out</text>
    <text class="deco arrow-label" x="296" y="316">2 K⁺ in</text>
    <text class="deco arrow-label" x="232" y="336">ATP</text>

    <g data-ref="voltage-gated-sodium-channel">
      <rect x="414" y="160" width="18" height="90" rx="6"/><rect x="446" y="160" width="18" height="90" rx="6"/>
      <rect x="430" y="232" width="18" height="10" rx="3"/>
    </g>
    <g data-ref="voltage-gated-potassium-channel">
      <rect x="544" y="160" width="18" height="90" rx="6"/><rect x="576" y="160" width="18" height="90" rx="6"/>
      <rect x="560" y="232" width="18" height="10" rx="3"/>
    </g>
    <g data-ref="ionotropic-receptor">
      <rect x="674" y="160" width="18" height="90" rx="6"/><rect x="706" y="160" width="18" height="90" rx="6"/>
      <path d="M 690 146 L 708 146 L 699 132 Z"/>
    </g>
    <path data-ref="calcium-pump" d="M 818 156 C 818 146 868 146 868 156 L 872 254 C 872 266 814 266 814 254 Z"/>
    <path class="deco flow" marker-end="url(#mem-arrow)" d="M 843 290 L 843 112"/>

    <g data-ref="sodium-ion" data-fill="#e69f00">
      <circle cx="60" cy="70" r="15"/><text x="60" y="75" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="170" cy="52" r="15"/><text x="170" y="57" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="330" cy="60" r="15"/><text x="330" y="65" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="390" cy="110" r="15"/><text x="390" y="115" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="500" cy="50" r="15"/><text x="500" y="55" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="610" cy="100" r="15"/><text x="610" y="105" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="760" cy="60" r="15"/><text x="760" y="65" text-anchor="middle" class="ion-dot">Na⁺</text>
      <circle cx="820" cy="90" r="15"/><text x="820" y="95" text-anchor="middle" class="ion-dot">Na⁺</text>
      
      <circle cx="460" cy="118" r="15"/><text x="460" y="123" text-anchor="middle" class="ion-dot">Na⁺</text>
    </g>
    <g data-ref="chloride-ion" data-fill="#3fbf8f">
      <circle cx="100" cy="104" r="15"/><text x="100" y="109" text-anchor="middle" class="ion-dot">Cl⁻</text>
      <circle cx="260" cy="46" r="15"/><text x="260" y="51" text-anchor="middle" class="ion-dot">Cl⁻</text>
      <circle cx="560" cy="60" r="15"/><text x="560" y="65" text-anchor="middle" class="ion-dot">Cl⁻</text>
      <circle cx="700" cy="94" r="15"/><text x="700" y="99" text-anchor="middle" class="ion-dot">Cl⁻</text>
      <circle cx="880" cy="52" r="15"/><text x="880" y="57" text-anchor="middle" class="ion-dot">Cl⁻</text>
    </g>
    <g data-ref="calcium-ion" data-fill="#56b4e9">
      <circle cx="420" cy="46" r="18"/><text x="420" y="51" text-anchor="middle" class="ion-dot">Ca²⁺</text>
      <circle cx="650" cy="40" r="18"/><text x="650" y="45" text-anchor="middle" class="ion-dot">Ca²⁺</text>
    </g>
    <g data-ref="potassium-ion" data-fill="#a58bdc">
      <circle cx="60" cy="320" r="15"/><text x="60" y="325" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="170" cy="380" r="15"/><text x="170" y="385" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="360" cy="330" r="15"/><text x="360" y="335" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="420" cy="392" r="15"/><text x="420" y="397" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="520" cy="316" r="15"/><text x="520" y="321" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="600" cy="380" r="15"/><text x="600" y="385" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="700" cy="330" r="15"/><text x="700" y="335" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="780" cy="390" r="15"/><text x="780" y="395" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="860" cy="330" r="15"/><text x="860" y="335" text-anchor="middle" class="ion-dot">K⁺</text>
      <circle cx="200" cy="410" r="15"/><text x="200" y="415" text-anchor="middle" class="ion-dot">K⁺</text>
    </g>

    <g class="labels lbl-base">
      <text text-anchor="middle" data-label-for="potassium-leak-channel" x="121" y="282">K⁺ leak channel</text>
      <text text-anchor="middle" data-label-for="sodium-potassium-pump" x="270" y="372">Na⁺/K⁺ pump</text>
      <text text-anchor="middle" data-label-for="voltage-gated-sodium-channel" x="440" y="276">Voltage-gated Na⁺ channel</text>
      <text text-anchor="middle" data-label-for="voltage-gated-potassium-channel" x="570" y="302">Voltage-gated K⁺ channel</text>
      <text text-anchor="middle" data-label-for="ionotropic-receptor" x="700" y="282">Ligand-gated channel</text>
      <text text-anchor="middle" data-label-for="calcium-pump" x="843" y="310">Ca²⁺ pump</text>
      <text text-anchor="middle" data-label-for="phospholipid-bilayer" x="450" y="210" class="small">Phospholipid bilayer</text>
    </g>
  </g>
</svg>
