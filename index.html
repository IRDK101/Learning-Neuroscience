<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Learn and review introductory neuroscience with interactive brain maps, lessons, flashcards and games." />
    <meta name="theme-color" content="#0b1a33" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f7fd" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>NeuroMap</title>
    <script>
      // Resolve the theme before first paint (saved choice, else the device setting) to avoid a flash.
      (function () {
        var t;
        try {
          t = JSON.parse(localStorage.getItem('neuromap:v1') || '{}').settings.theme;
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
