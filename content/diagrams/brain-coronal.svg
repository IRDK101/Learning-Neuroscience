<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 20 790 480" role="img" aria-label="Coronal slice through the brain at the level of the thalamus">
  <!-- Original drawing for NeuroMap. Stylized, not to scale. Coronal (front-to-back) slice seen from the front.
       Each structure is drawn on the left hemisphere and mirrored. The amygdala actually sits just in front of
       this slice; it is drawn faintly so both medial temporal structures appear together. -->
  <g class="base">
    <g data-ref="cerebral-cortex">
      <path d="M 345 45 C 230 40 95 100 70 230 C 58 300 75 350 110 380 C 120 420 150 470 210 472 C 250 472 270 445 276 412 C 292 400 312 396 338 395 L 345 395 L 345 175 Z"/>
      <g transform="translate(700,0) scale(-1,1)"><path d="M 345 45 C 230 40 95 100 70 230 C 58 300 75 350 110 380 C 120 420 150 470 210 472 C 250 472 270 445 276 412 C 292 400 312 396 338 395 L 345 395 L 345 175 Z"/></g>
    </g>
    <g data-ref="white-matter" data-fill="var(--sys-white-matter)">
      <path d="M 340 176 C 250 80 118 122 96 232 C 86 300 104 340 140 368 C 160 410 186 444 216 444 C 244 444 256 420 256 396 L 330 388 L 340 300 Z"/>
      <g transform="translate(700,0) scale(-1,1)"><path d="M 340 176 C 250 80 118 122 96 232 C 86 300 104 340 140 368 C 160 410 186 444 216 444 C 244 444 256 420 256 396 L 330 388 L 340 300 Z"/></g>
    </g>
    <g data-ref="insula">
      <path d="M 178 250 C 170 275 170 305 180 330 L 192 328 C 184 305 184 278 190 254 Z"/>
      <g transform="translate(700,0) scale(-1,1)"><path d="M 178 250 C 170 275 170 305 180 330 L 192 328 C 184 305 184 278 190 254 Z"/></g>
    </g>
    <path data-ref="corpus-callosum" data-fill="#cdbf98" d="M 236 196 C 280 166 420 166 464 196 L 458 212 C 420 186 280 186 242 212 Z"/>
    <g data-ref="lateral-ventricles">
      <path d="M 346 206 C 322 204 288 210 272 226 C 290 236 322 234 346 230 Z"/>
      <g transform="translate(700,0) scale(-1,1)"><path d="M 346 206 C 322 204 288 210 272 226 C 290 236 322 234 346 230 Z"/></g>
    </g>
    <g data-ref="caudate-nucleus">
      <ellipse cx="270" cy="240" rx="19" ry="21"/>
      <g transform="translate(700,0) scale(-1,1)"><ellipse cx="270" cy="240" rx="19" ry="21"/></g>
    </g>
    <g data-ref="putamen">
      <ellipse cx="222" cy="288" rx="22" ry="44" transform="rotate(8 222 288)"/>
      <g transform="translate(700,0) scale(-1,1)"><ellipse cx="222" cy="288" rx="22" ry="44" transform="rotate(8 222 288)"/></g>
    </g>
    <g data-ref="globus-pallidus">
      <ellipse cx="252" cy="296" rx="11" ry="30" transform="rotate(8 252 296)"/>
      <g transform="translate(700,0) scale(-1,1)"><ellipse cx="252" cy="296" rx="11" ry="30" transform="rotate(8 252 296)"/></g>
    </g>
    <g data-ref="thalamus">
      <ellipse cx="318" cy="286" rx="27" ry="38"/>
      <g transform="translate(700,0) scale(-1,1)"><ellipse cx="318" cy="286" rx="27" ry="38"/></g>
    </g>
    <rect data-ref="third-ventricle" x="346" y="250" width="8" height="78" rx="3"/>
    <path data-ref="hypothalamus" d="M 322 334 C 336 326 364 326 378 334 C 384 350 366 368 350 368 C 334 368 316 350 322 334 Z"/>
    <g data-ref="hippocampus">
      <path d="M 210 412 C 222 398 252 398 262 410 C 268 420 258 430 246 426 C 236 422 226 428 220 432 C 208 430 204 420 210 412 Z"/>
      <g transform="translate(700,0) scale(-1,1)"><path d="M 210 412 C 222 398 252 398 262 410 C 268 420 258 430 246 426 C 236 422 226 428 220 432 C 208 430 204 420 210 412 Z"/></g>
    </g>
    <g data-ref="amygdala" class="ghost">
      <ellipse cx="236" cy="384" rx="17" ry="12"/>
      <g transform="translate(700,0) scale(-1,1)"><ellipse cx="236" cy="384" rx="17" ry="12"/></g>
    </g>
    <g class="deco sulcus">
      <path d="M 350 45 L 350 172"/>
    </g>
    <g class="labels lbl-base">
      <text data-label-for="cerebral-cortex" x="660" y="90">Cortex (grey matter)</text>
      <line data-label-for="cerebral-cortex" class="leader" x1="658" y1="86" x2="560" y2="96"/>
      <text data-label-for="white-matter" x="660" y="130">White matter</text>
      <line data-label-for="white-matter" class="leader" x1="658" y1="126" x2="540" y2="160"/>
      <text text-anchor="middle" data-label-for="corpus-callosum" x="350" y="160">Corpus callosum</text>
      <text data-label-for="lateral-ventricles" x="660" y="196">Lateral ventricle</text>
      <line data-label-for="lateral-ventricles" class="leader" x1="658" y1="192" x2="390" y2="220"/>
      <text data-label-for="caudate-nucleus" x="660" y="226">Caudate nucleus</text>
      <line data-label-for="caudate-nucleus" class="leader" x1="658" y1="222" x2="448" y2="238"/>
      <text data-label-for="insula" x="660" y="262">Insula</text>
      <line data-label-for="insula" class="leader" x1="658" y1="258" x2="520" y2="280"/>
      <text data-label-for="putamen" x="660" y="290">Putamen</text>
      <line data-label-for="putamen" class="leader" x1="658" y1="286" x2="500" y2="290"/>
      <text data-label-for="globus-pallidus" x="660" y="318">Globus pallidus</text>
      <line data-label-for="globus-pallidus" class="leader" x1="658" y1="314" x2="456" y2="300"/>
      <text text-anchor="end" data-label-for="thalamus" x="250" y="152">Thalamus</text>
      <line data-label-for="thalamus" class="leader" x1="252" y1="156" x2="318" y2="262"/>
      <text text-anchor="end" data-label-for="third-ventricle" x="150" y="190">Third ventricle</text>
      <line data-label-for="third-ventricle" class="leader" x1="152" y1="194" x2="348" y2="270"/>
      <text data-label-for="hypothalamus" x="660" y="352">Hypothalamus</text>
      <line data-label-for="hypothalamus" class="leader" x1="658" y1="348" x2="378" y2="350"/>
      <text data-label-for="amygdala" x="660" y="390">Amygdala (just in front)</text>
      <line data-label-for="amygdala" class="leader" x1="658" y1="386" x2="480" y2="384"/>
      <text data-label-for="hippocampus" x="660" y="425">Hippocampus</text>
      <line data-label-for="hippocampus" class="leader" x1="658" y1="421" x2="490" y2="414"/>
    </g>
  </g>
</svg>
